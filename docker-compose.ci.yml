services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concursoshub_e2e
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/WebApplication_App_Concurso
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=concursoshub_e2e;Username=postgres;Password=postgres"
      JobsSettings__UrlCreateConcurso: "http://localhost/fake-url-for-e2e"
      Security__CreateConcursoApiKey: "${CONCURSO_API_KEY}"
      ScrapingSettings__BaseUrl: "https://www.concursosnobrasil.com.br/concursos"
      ScrapingSettings__PciUrl: "https://www.pciconcursos.com.br/concursos"
      ScrapingSettings__UserAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy