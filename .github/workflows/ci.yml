name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean install (workaround rolldown native binding bug)
        run: rm -rf node_modules package-lock.json && npm install
      - run: npm run test -- --run

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests]
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: sandrof450/concursos-hub-api
          path: backend

      - name: Build and start services
        run: docker compose -f docker-compose.ci.yml up --build -d

      - name: Show backend logs (debug)
        if: always()
        run: docker compose -f docker-compose.ci.yml logs backend

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:8080 --timeout 60000
      
      - name: Seed concursos data (trigger scrapers)
        run: curl -X POST http://localhost:5000/api/Concurso --fail --max-time 60

      - name: Install frontend dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v